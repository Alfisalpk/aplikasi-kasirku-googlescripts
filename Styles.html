<style>
:root {
  --forest: #062719;
  --forest-2: #0c3826;
  --lime: #b6ed38;
  --ink: #14231b;
  --muted: #819087;
  --canvas: #f5f7f4;
  --line: #e9eee9;
  --white: #fff;
  --green: #19945d;
  --red: #e45858;
  --blue: #4b80d9;
  --orange: #e9a439;
  --radius: 16px;
  --shadow: 0 8px 24px rgba(16,44,29,.045);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 14px 'DM Sans',sans-serif;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
.app-shell {
  min-height: 100vh;
}
.sidebar {
  width: 252px;
  background: var(--forest);
  color: #fff;
  position: fixed;
  inset: 0 auto 0 0;
  padding: 27px 17px 18px;
  display: flex;
  flex-direction: column;
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #fff;
  text-decoration: none;
  font: 800 21px 'Plus Jakarta Sans',sans-serif;
  letter-spacing: -1px;
  padding: 0 10px 42px;
}
.brand:hover {
  color: #fff;
}
.brand-mark {
  width: 39px;
  height: 39px;
  border-radius: 12px;
  background: var(--lime);
  color: var(--forest);
  display: grid;
  place-items: center;
  font-size: 19px;
}
.brand-accent {
  color: var(--lime);
}
.brand small {
  display: block;
  font: 600 9px 'DM Sans',sans-serif;
  color: #91a89a;
  letter-spacing: 1.9px;
  margin-top: 2px;
}
.nav-caption {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.4px;
  color: #789184;
  padding: 0 13px 12px;
}
.side-nav {
  display: grid;
  gap: 5px;
}
.nav-link {
  border: 0;
  background: none;
  color: #afc0b5;
  text-align: left;
  border-radius: 10px;
  padding: 12px 13px;
  display: flex;
  align-items: center;
  gap: 13px;
  font-weight: 600;
  font-size: 13px;
  transition: .18s;
}
.nav-link i {
  font-size: 16px;
  width: 18px;
}
.nav-link:hover {
  color: #fff;
  background: #ffffff0c;
}
.nav-link.active {
  background: #ffffff12;
  color: #fff;
  box-shadow: inset 3px 0 var(--lime);
}
.nav-link.active i {
  color: var(--lime);
}
.nav-pill {
  margin-left: auto;
  color: var(--lime);
  background: #b6ed3818;
  border-radius: 5px;
  padding: 3px 6px;
  font-size: 9px;
}
.sidebar-bottom {
  margin-top: auto;
}
.help-card {
  background: #ffffff0c;
  border: 1px solid #ffffff0e;
  border-radius: 13px;
  padding: 14px;
  margin-bottom: 16px;
}
.help-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: #b6ed3824;
  color: var(--lime);
  border-radius: 8px;
  margin-bottom: 12px;
}
.help-card strong {
  font-size: 12px;
}
.help-card p {
  color: #9fb1a5;
  font-size: 11px;
  line-height: 1.6;
  margin: 6px 0 11px;
}
.help-card a {
  color: var(--lime);
  font-size: 11px;
  font-weight: 700;
}
.user-card {
  border-top: 1px solid #ffffff17;
  padding: 16px 7px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar,
.top-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #e3f2c4;
  color: #38561d;
  font-weight: 800;
}
.user-card strong,
.user-card small {
  display: block;
}
.user-card strong {
  font-size: 11px;
}
.user-card small {
  font-size: 10px;
  color: #93a99a;
  margin-top: 3px;
}
.user-card>i {
  margin-left: auto;
  color: #8da497;
}
.main-area {
  margin-left: 252px;
  min-height: 100vh;
  padding: 0 35px 20px;
  max-width: 1800px;
}
.topbar {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #97a198;
  font-size: 12px;
}
.breadcrumb i {
  font-size: 10px;
}
.breadcrumb strong {
  color: #34443a;
  font-weight: 600;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}
.today-label {
  font-size: 11px;
  color: #78867d;
}
.icon-button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: #546259;
  display: grid;
  place-items: center;
  position: relative;
}
.notification-dot {
  position: absolute;
  width: 6px;
  height: 6px;
  right: 7px;
  top: 7px;
  background: #ef655c;
  border: 1px solid white;
  border-radius: 50%;
}
.top-avatar {
  width: 32px;
  height: 32px;
  font-size: 12px;
}
.mobile-menu {
  display: none;
}
.page {
  display: none;
  padding-top: 29px;
}
.page.active {
  display: block;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 23px;
}
.eyebrow {
  font-size: 9px;
  letter-spacing: 1.35px;
  font-weight: 700;
  color: #96a198;
  margin-bottom: 8px;
}
.page-heading h1 {
  font: 700 23px 'Plus Jakarta Sans',sans-serif;
  letter-spacing: -.7px;
  margin: 0;
}
.page-heading h1 span {
  font-size: 19px;
}
.page-heading p,
.panel-heading p,
.cart-heading p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  font-weight: 700;
  font-size: 11px;
  transition: .15s;
}
.button-dark {
  background: var(--forest);
  color: #fff;
}
.button-dark:hover {
  background: #10452e;
  color: #fff;
}
.button-lime {
  background: var(--lime);
  color: #183018;
}
.button-lime:hover {
  background: #c5f35d;
}
.button-light {
  background: #f0f3ef;
  color: #506056;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.metric-card,
.panel {
  background: var(--white);
  border: 1px solid #edf0ed;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.metric-card {
  padding: 17px 18px 15px;
}
.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #67756b;
  font-size: 11px;
  font-weight: 600;
}
.metric-icon {
  width: 31px;
  height: 31px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.metric-icon.green {
  background: #e4f5e9;
  color: #26905a;
}
.metric-icon.blue {
  background: #e9f0fc;
  color: #5987d2;
}
.metric-icon.orange {
  background: #fff3df;
  color: #d59027;
}
.metric-icon.red {
  background: #ffeded;
  color: #d95d5d;
}
.metric-card>strong {
  display: block;
  font: 700 22px 'Plus Jakarta Sans',sans-serif;
  letter-spacing: -.5px;
  margin-top: 13px;
}
.metric-card>strong small {
  font: 500 11px 'DM Sans',sans-serif;
  color: #89958c;
  letter-spacing: 0;
}
.metric-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #99a39c;
  font-size: 10px;
  margin-top: 9px;
}
.trend {
  border-radius: 5px;
  padding: 3px 5px;
  font-weight: 700;
}
.trend.positive {
  color: #238653;
  background: #e9f7ed;
}
.trend.negative {
  color: #cb5353;
  background: #fff0f0;
}
.metric-note {
  color: #99a39c;
}
.text-link {
  border: 0;
  background: none;
  color: #288258;
  padding: 0;
  font-size: 10px;
  font-weight: 700;
}
.text-link:hover {
  color: #135c38;
}
.content-grid {
  display: grid;
  grid-template-columns: minmax(0,1.75fr) minmax(260px,1fr);
  gap: 15px;
  margin-bottom: 16px;
}
.panel {
  padding: 18px 19px;
}
.panel-heading,
.cart-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-heading h2,
.cart-heading h2,
.modal-heading h2 {
  font: 700 13px 'Plus Jakarta Sans',sans-serif;
  margin: 0;
}
.panel-heading p {
  font-size: 10px;
}
.select-control {
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: #55645b;
  padding: 0 29px 0 10px;
  font-size: 10px;
  outline: 0;
}
.select-control:focus,
.search-box:focus-within,
input:focus {
  border-color: #a8cd77!important;
  box-shadow: 0 0 0 3px #b6ed3820;
}
.chart-box {
  min-height: 245px;
  margin: 7px -6px -4px;
}
.stock-list {
  margin-top: 14px;
  display: grid;
  gap: 12px;
}
.stock-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.stock-product-icon,
.product-thumb {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #f2f5ef;
  color: #557451;
  font-size: 15px;
  flex: none;
}
.stock-info {
  min-width: 0;
  flex: 1;
}
.stock-info strong,
.stock-info small {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stock-info strong {
  font-size: 10px;
}
.stock-info small {
  font-size: 9px;
  color: #9aa49d;
  margin-top: 4px;
}
.stock-level {
  font-size: 9px;
  font-weight: 700;
  color: #d46b47;
  background: #fff3e9;
  border-radius: 5px;
  padding: 5px 7px;
}
.more-button {
  border: 1px solid var(--line);
  background: #fff;
  width: 29px;
  height: 29px;
  border-radius: 8px;
  color: #738177;
}
.table-panel {
  padding: 18px 0 0;
  overflow: hidden;
}
.table-panel>.panel-heading {
  padding: 0 19px 14px;
}
.table-wrap {
  overflow: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
thead {
  background: #f8faf8;
}
th {
  padding: 11px 16px;
  color: #9aa49d;
  font-size: 8px;
  letter-spacing: .8px;
  font-weight: 700;
  white-space: nowrap;
}
td {
  padding: 12px 16px;
  border-top: 1px solid #f0f2ef;
  color: #5c6b61;
  font-size: 10px;
  white-space: nowrap;
}
td:first-child {
  font-weight: 700;
  color: #304137;
}
.table-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #eaf7ee;
  color: #278252;
  border-radius: 20px;
  padding: 5px 8px;
  font-size: 9px;
  font-weight: 700;
}
.table-status:before {
  content: '';
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 50%;
}
.app-footer {
  display: flex;
  justify-content: space-between;
  color: #9aa49d;
  font-size: 9px;
  padding: 19px 2px 0;
}
.app-footer i {
  color: #e36f66;
  font-size: 8px;
}
.pos-time {
  font-size: 11px;
  color: #748178;
}
.pos-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 340px;
  gap: 16px;
  align-items: start;
}
.catalog-panel {
  padding: 16px;
}
.catalog-tools {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
  height: 35px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: #98a49b;
}
.search-box i {
  font-size: 12px;
}
.search-box input {
  border: 0!important;
  outline: 0;
  box-shadow: none!important;
  width: 100%;
  height: 100%;
  font-size: 10px;
  color: #334238;
  background: transparent;
}
.search-box input::placeholder {
  color: #a4aea6;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 10px;
}
.product-card {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px;
  text-align: left;
  background: #fff;
  transition: .16s;
  min-width: 0;
}
.product-card:hover {
  border-color: #a8cf75;
  box-shadow: 0 5px 15px #23401d0c;
  transform: translateY(-1px);
}
.product-card:disabled {
  opacity: .55;
  cursor: not-allowed;
}
.product-card .product-thumb {
  width: 100%;
  height: 75px;
  font-size: 24px;
  border-radius: 8px;
  margin-bottom: 10px;
}
.product-card strong {
  display: block;
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #26362b;
}
.product-card small {
  display: block;
  color: #a0aaa2;
  font-size: 9px;
  margin-top: 4px;
}
.product-card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
}
.product-card-bottom b {
  font-size: 10px;
  color: #287b4b;
}
.product-card-bottom span {
  font-size: 9px;
  color: #98a39b;
}
.cart-panel {
  padding: 17px;
  position: sticky;
  top: 15px;
}
.cart-heading {
  padding-bottom: 14px;
  border-bottom: 1px solid #edf0ed;
}
.cart-heading p {
  font-size: 10px;
}
.cart-heading p span {
  color: #318052;
  font-weight: 700;
}
.cart-items {
  max-height: 245px;
  overflow: auto;
}
.empty-state {
  height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #a0aaa2;
  gap: 6px;
  text-align: center;
}
.empty-state i {
  font-size: 24px;
  color: #c7d1c8;
}
.empty-state strong {
  font-size: 10px;
  color: #718076;
}
.empty-state span {
  font-size: 9px;
}
.cart-line {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 0;
  border-bottom: 1px solid #f0f2ef;
}
.cart-line .product-thumb {
  width: 34px;
  height: 34px;
}
.cart-line-info {
  min-width: 0;
  flex: 1;
}
.cart-line-info strong {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
}
.cart-line-info small {
  font-size: 9px;
  color: #98a29a;
}
.qty-control {
  display: flex;
  align-items: center;
  gap: 5px;
}
.qty-control button {
  width: 21px;
  height: 21px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: #54645a;
  font-size: 11px;
}
.qty-control span {
  font-size: 10px;
  font-weight: 700;
  min-width: 12px;
  text-align: center;
}
.cart-summary {
  border-top: 1px solid #edf0ed;
  padding-top: 13px;
  margin-top: 3px;
}
.cart-summary>div,
.discount-row,
.change-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: #78867c;
  margin-bottom: 10px;
}
.cart-summary strong {
  color: #334238;
  font-size: 10px;
}
.discount-row {
  margin-bottom: 10px;
}
.money-input {
  display: flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 0 7px;
  height: 29px;
  color: #98a39b;
  font-size: 9px;
}
.money-input input {
  border: 0;
  outline: 0;
  width: 85px;
  text-align: right;
  color: #435247;
  font-size: 10px;
}
.total-row {
  border-top: 1px dashed #e3e9e3;
  padding-top: 11px;
  margin-top: 11px;
}
.total-row strong {
  font: 700 17px 'Plus Jakarta Sans',sans-serif;
  color: #173d27;
}
.payment-label {
  display: block;
  color: #77847b;
  font-size: 9px;
  font-weight: 700;
  margin: 13px 0 6px;
}
.full-width {
  width: 100%;
}
.paid-input {
  height: 34px;
}
.paid-input input {
  flex: 1;
  text-align: left;
}
.change-row {
  margin: 10px 0 13px;
}
.change-row strong {
  color: #258252;
}
.checkout-button {
  width: 100%;
  height: 39px;
}
.product-stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 14px;
  margin-bottom: 16px;
}
.mini-stat {
  position: relative;
  padding: 16px 18px;
}
.mini-stat span {
  display: block;
  color: #7e8a81;
  font-size: 10px;
}
.mini-stat strong {
  display: block;
  font: 700 19px 'Plus Jakarta Sans',sans-serif;
  margin-top: 7px;
}
.mini-stat>i {
  position: absolute;
  right: 17px;
  top: 17px;
  font-size: 17px;
  color: #9dbc7f;
}
.table-tools {
  display: flex;
  gap: 8px;
}
.search-box.compact {
  width: 180px;
  flex: none;
  height: 32px;
}
.product-cell {
  display: flex;
  align-items: center;
  gap: 9px;
}
.product-cell .product-thumb {
  width: 30px;
  height: 30px;
}
.product-cell strong,
.product-cell small {
  display: block;
}
.product-cell strong {
  font-size: 10px;
}
.product-cell small {
  font-size: 9px;
  color: #9aa49d;
  margin-top: 3px;
}
.stock-badge {
  border-radius: 20px;
  padding: 5px 8px;
  font-size: 9px;
  font-weight: 700;
}
.stock-badge.ok {
  background: #eaf7ee;
  color: #278252;
}
.stock-badge.low {
  background: #fff3e7;
  color: #ce792c;
}
.row-actions {
  display: flex;
  gap: 5px;
}
.row-actions button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 6px;
  width: 25px;
  height: 25px;
  color: #6c7b70;
}
.row-actions .delete {
  color: #ce6666;
}
.report-metrics {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
.report-grid {
  grid-template-columns: minmax(0,1.5fr) minmax(260px,1fr);
}
.breakdown-list {
  display: grid;
  gap: 15px;
  margin-top: 22px;
}
.breakdown-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 7px;
  font-size: 10px;
  color: #758278;
}
.breakdown-row strong {
  color: #405146;
}
.progress-track {
  grid-column: 1/3;
  height: 6px;
  border-radius: 5px;
  background: #eff3ee;
  overflow: hidden;
}
.progress-track span {
  display: block;
  height: 100%;
  border-radius: 5px;
  background: #8fc855;
}
.rank-cell {
  font: 700 11px 'Plus Jakarta Sans',sans-serif;
  color: #8aa568;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #11271dc0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 30;
}
.modal-backdrop.open {
  display: flex;
}
.modal-card {
  width: min(100%,470px);
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 22px 80px #0003;
}
.modal-heading {
  display: flex;
